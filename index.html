<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>Hyperjump</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-black text-cyan-400">
<canvas id="hyperspace-canvas"></canvas>

<div class="fixed inset-0 pointer-events-none z-10 flex flex-col justify-between p-6 md:p-8" style="padding-top:max(1.5rem, env(safe-area-inset-top)); padding-bottom:max(1.5rem, env(safe-area-inset-bottom));">
  <div class="flex items-center justify-end w-full gap-3">
    <button class="pointer-events-auto group relative flex items-center gap-3 px-6 py-3 rounded-xl border-2 border-cyan-400/80 bg-black/70 hover:bg-cyan-950/50 active:scale-95 text-cyan-200 font-orbitron font-bold text-sm tracking-widest uppercase transition-all duration-300 cursor-pointer shadow-[0_0_20px_rgba(6,182,212,0.2)] hover:shadow-[0_0_25px_rgba(56,189,248,0.5)]" id="hyperdrive-btn">
      <svg class="w-5 h-5 text-cyan-300 transition-transform duration-500 group-hover:scale-110" fill="currentColor" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
      <span class="text-glow" id="btn-label">VELOCIDAD DE LA LUZ</span>
    </button>
  </div>
  <div class="flex items-center justify-center w-full">
  </div>
</div>

<script src="js/shaders.js"></script>
<script src="js/main.js"></script>
